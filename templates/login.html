{% extends "base.html" %}

{% block title %}Login - MediGuide{% endblock %}

{% block content %}
<section class="auth-section">
    <h1>Welcome Back</h1>
    <p class="auth-intro">Log in with your phone number and PIN.</p>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
        <label for="phone_number">Phone Number</label>
        <input type="text" id="phone_number" name="phone_number" placeholder="10-digit number" maxlength="10"
               value="{{ request.form.get('phone_number', '') }}" required>

        <label for="pin">PIN</label>
        <input type="password" id="pin" name="pin" placeholder="Your PIN" maxlength="6" inputmode="numeric" required>

        <button type="submit" class="btn-primary">Log In</button>
    </form>

    <p class="auth-switch">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
{% endblock %}
