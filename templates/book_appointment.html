{% extends "base.html" %}

{% block title %}Book Appointment - MediGuide{% endblock %}

{% block content %}
<section class="booking-section">
    <a href="{{ url_for('doctor_detail', doctor_id=doctor.id) }}" class="btn-link">&larr; Back to {{ doctor.name }}</a>

    <h1>Book with {{ doctor.name }}</h1>
    <p class="booking-intro">{{ doctor.specialty }} &middot; {{ doctor.hospital_name }}</p>

    <form method="POST" action="{{ url_for('book_appointment', doctor_id=doctor.id) }}" class="auth-form">
        <label for="appointment_date">Date</label>
        <input type="date" id="appointment_date" name="appointment_date" min="{{ min_date }}" required>

        <label for="time_slot">Time Slot</label>
        <select id="time_slot" name="time_slot" required>
            <option value="">Select a time</option>
            {% for slot in time_slots %}
                <option value="{{ slot }}">{{ slot }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn-primary">Confirm Booking</button>
    </form>
</section>
{% endblock %}
