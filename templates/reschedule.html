{% extends "base.html" %}

{% block title %}Reschedule Appointment - MediGuide{% endblock %}

{% block content %}
<section class="booking-section">
    <a href="{{ url_for('my_appointments') }}" class="btn-link">&larr; Back to My Appointments</a>

    <h1>Reschedule with {{ doctor.name }}</h1>
    <p class="booking-intro">{{ doctor.specialty }} &middot; {{ doctor.hospital_name }}</p>

    <form method="POST" action="{{ url_for('reschedule_appointment', booking_id=booking.id) }}" class="auth-form">
        <label for="appointment_date">New Date</label>
        <input type="date" id="appointment_date" name="appointment_date" min="{{ min_date }}"
               value="{{ booking.appointment_date }}" required>

        <label for="time_slot">New Time Slot</label>
        <select id="time_slot" name="time_slot" required>
            {% for slot in time_slots %}
                <option value="{{ slot }}" {% if slot == booking.time_slot %}selected{% endif %}>{{ slot }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn-primary">Save Changes</button>
    </form>
</section>
{% endblock %}
